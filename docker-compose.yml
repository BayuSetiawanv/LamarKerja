services:
  # ==========================================
  # DATABASE: PostgreSQL + pgvector
  # ==========================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lamarkerja_postgres
    environment:
      POSTGRES_USER: lamarkerja
      POSTGRES_PASSWORD: secret123
      POSTGRES_DB: lamarkerja_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lamarkerja"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # AI ENGINE: Ollama (Local LLM)
  # ==========================================
  ollama:
    image: ollama/ollama:latest
    container_name: lamarkerja_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  ollama_data: